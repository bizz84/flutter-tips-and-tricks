<div class="title">Claude Code: <em>!</em> for Shell Mode</div>
<p>Start your prompt with <em>!</em> to run a shell command:</p>
<div class="cc">
  <div class="cc-input"><span class="cc-mark">!</span> flutter test<span class="cc-cursor"></span></div>
  <div class="cc-hint">! for shell mode</div>
</div>
<ul>
  <li>The output goes into the <em>conversation</em>, so Claude can act on it</li>
  <li><em>4x fewer tokens</em> than asking Claude to run it</li>
</ul>
<div class="callout">💡 Tests failed? Just say: <em>"fix the failing tests"</em></div>
